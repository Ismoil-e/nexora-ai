<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Register - Nexora AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="navbar">
        <div class="logo">Nexora AI Chat</div>
      </div>
    </header>

    <main class="login-page">
      <div class="login-container">
        <h1>Войти или Зарегистрироваться</h1>
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" required>
          </div>
          <button type="submit" class="btn-login">Войти</button>
        </form>
        <div class="auth-divider"><span>yoki</span></div>
        <button type="button" class="btn-google" id="googleSignInBtn">Google orqali kirish</button>
        <p class="auth-note" id="googleAuthStatus">Firebase config qo'shilgach Google login ishlaydi.</p>
        <p>Нет аккаунта? <a href="#" id="registerLink">Зарегистрироваться</a></p>
        <form id="registerForm" style="display: none;">
          <div class="form-group">
            <label for="regFirstName">Ism</label>
            <input type="text" id="regFirstName" required>
          </div>
          <div class="form-group">
            <label for="regLastName">Familiya</label>
            <input type="text" id="regLastName" required>
          </div>
          <div class="form-group">
            <label for="regBusinessName">Biznes nomi</label>
            <input type="text" id="regBusinessName" required>
          </div>
          <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" required>
          </div>
          <div class="form-group">
            <label for="regPassword">Пароль</label>
            <input type="password" id="regPassword" required>
          </div>
          <button type="submit" class="btn-login">Зарегистрироваться</button>
        </form>
        <p><a href="index.html">Вернуться на главную</a></p>
      </div>
    </main>

    <script src="login.js"></script>
    <script type="module" src="auth-google.js"></script>
  </body>
</html>
