[project]
name = "nexora-ai-backend"
version = "1.0.0"
description = "Nexora AI SaaS Platform Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.10.0",
    "asyncpg>=0.28.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.5",
    "redis>=4.5.0",
    "minio>=7.0.0",
    "structlog>=23.0.0",
    "httpx>=0.24.0",
    "pdfplumber>=0.7.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.0.0",
    "pillow>=10.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]
