version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nexora-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./data:/app/data
    networks:
      - nexora-network

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nexora-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ./data:/app/data
    networks:
      - nexora-network

  postgres:
    image: pgvector/pgvector:pg17
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora_db
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexora-network

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - nexora-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: nexora-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - nexora-network

  minio:
    image: minio/minio:latest
    container_name: nexora-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: nexora_access
      MINIO_ROOT_PASSWORD: nexora_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - nexora-network

  nginx:
    image: nginx:alpine
    container_name: nexora-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
    depends_on:
      - app
    networks:
      - nexora-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  nexora-network:
    driver: bridge
