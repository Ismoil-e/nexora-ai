<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile - Nexora AI</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="back-link" href="chat.html">← Orqaga</a>
      <div class="header-logo">Nexora <span class="header-logo-ai">AI</span></div>
    </header>

    <main class="profile-edit-page">
      <section class="profile-edit-card">
        <h1 class="profile-edit-title">Profilni o'zgartirish</h1>
        <p class="profile-edit-subtitle">Rasm, ism, familiya va biznes nomini yangilang.</p>

        <form id="editProfileForm" class="profile-edit-form">
          <div class="profile-photo-upload">
            <div class="profile-photo-preview" id="photoPreview">NA</div>
            <label class="photo-upload-label" for="profilePhoto">Photo yuklash</label>
            <input type="file" id="profilePhoto" accept="image/*" />
          </div>

          <div class="form-group">
            <label for="firstName">Ism</label>
            <input type="text" id="firstName" required />
          </div>

          <div class="form-group">
            <label for="lastName">Familiya</label>
            <input type="text" id="lastName" required />
          </div>

          <div class="form-group">
            <label for="businessName">Biznes nomi</label>
            <input type="text" id="businessName" required />
          </div>

          <button type="submit" class="btn-login">Saqlash</button>
        </form>
      </section>
    </main>

    <script src="edit-profile.js"></script>
  </body>
</html>
