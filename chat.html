<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora AI — Chat</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="dropdownMenu">☰</button>
      <div class="header-logo">Nexora <span class="header-logo-ai">AI</span></div>
    </header>
    
    <div class="menu-overlay" id="menuOverlay"></div>
    
    <aside class="dropdown-menu" id="dropdownMenu" aria-hidden="true">
      <div class="menu-panel-header">
        <div class="menu-title">Menu</div>
        <button class="menu-close-btn" id="menuCloseBtn" type="button" aria-label="Close menu">✕</button>
      </div>
      <div class="menu-content" id="menuContent"></div>
    </aside>

    <main class="chat-app">
      <section class="chat-panel" id="chatPanel">
        <div class="chat-history" id="chatHistory" aria-live="polite"></div>

        <form class="chat-input" id="chatForm">
          <textarea id="promptInput" placeholder="Xabaringizni yozing..." rows="1" required></textarea>
          <button type="submit" class="ripple-effect">Yuborish</button>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
