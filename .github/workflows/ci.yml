# =============================================================================
# Nexora AI — CI Pipeline
# Runs on every push and pull request
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Backend Tests
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install prometheus-client

      - name: Lint with Ruff
        working-directory: backend
        run: |
          pip install ruff
          ruff check app/ --output-format=github || true

      - name: Type check with MyPy
        working-directory: backend
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports --no-error-summary || true

      - name: Run tests
        working-directory: backend
        run: |
          python -m pytest tests/ -v --tb=short -q

      - name: Check imports
        working-directory: backend
        run: |
          python -c "from app.core.config import settings; print('Config OK')"
          python -c "from app.api.v1 import orchestrator, health; print('API OK')"

  # ---------------------------------------------------------------------------
  # Frontend Tests
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: TypeScript check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker Build
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: nexora-ai-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          tags: nexora-ai-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Security Check
  # ---------------------------------------------------------------------------
  security-check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -rn "sk-" --include="*.py" --include="*.ts" --include="*.js" . | grep -v ".env.example" | grep -v "node_modules" | grep -v "__pycache__"; then
            echo "WARNING: Potential secrets found in code!"
            exit 1
          fi
          echo "No hardcoded secrets found."

      - name: Check .env not committed
        run: |
          if [ -f .env ]; then
            echo "WARNING: .env file found in repository!"
            exit 1
          fi
          echo ".env not in repo — OK"

      - name: Check .gitignore
        run: |
          if grep -q "\.env" .gitignore; then
            echo ".env in .gitignore — OK"
          else
            echo "WARNING: .env not in .gitignore!"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Summary
  # ---------------------------------------------------------------------------
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-build, security-check]
    if: always()

    steps:
      - name: Report status
        run: |
          echo "CI Pipeline Complete"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          echo "Security Check: ${{ needs.security-check.result }}"

          if [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "CI FAILED"
            exit 1
          fi
          echo "CI PASSED"
